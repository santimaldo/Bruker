[pytest]
# Only collect the real test-suite. The repository root contains analysis
# scripts named test_*.py (e.g. test_EXSY_OOP_*.py) that must never be run
# by pytest: they open figures and read hard-coded datasets.
testpaths = tests
addopts = -ra
markers =
    data: test needs a real Bruker dataset on disk (skipped when it is missing)
filterwarnings =
    ignore::SyntaxWarning
